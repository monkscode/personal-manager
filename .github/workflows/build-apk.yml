name: Build Android APK

# Builds a debug APK on GitHub's runners (which have the Android SDK) and
# uploads it as a downloadable artifact. Run it from the Actions tab
# ("Run workflow"), then download the APK and sideload it on your phone.
on:
  workflow_dispatch:
  push:
    branches: [claude/expense-insight-app-i0uo2x]
    paths-ignore:
      - '**.md'
      - 'design/**'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: expense-insight-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
