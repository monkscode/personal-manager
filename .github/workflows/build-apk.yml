name: Build Android APK

# Builds a debug APK on GitHub's runners (which have the Android SDK) and
# uploads it as a downloadable artifact. Run it from the Actions tab
# ("Run workflow"), then download the APK and sideload it on your phone.
on:
  workflow_dispatch:
  push:
    branches: [claude/expense-insight-app-i0uo2x]
    paths-ignore:
      - '**.md'
      - 'design/**'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true

      - run: flutter pub get
      - run: flutter analyze

      # The persistence tests run real SQLite through sqflite_common_ffi, which
      # resolves libsqlite3.so.0 at runtime via dart:ffi. It is present on
      # ubuntu-latest today, but a base-image change would surface as
      # "Invalid argument(s): Failed to load dynamic library" from inside a test
      # rather than as a clear setup failure. Install it explicitly.
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-0
      - run: flutter test

      # Release + per-ABI splits keep the APK small (~10-15 MB for arm64 vs a
      # ~50 MB universal debug build). Signed with the committed debug key, so
      # the OAuth SHA-1 is unchanged. Install app-arm64-v8a-release.apk.
      - run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: expense-insight-apk
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
